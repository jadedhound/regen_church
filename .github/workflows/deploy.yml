name: Deploy
on:
  workflow_run: 
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy the artifact created
    
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: self-hosted
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4

    - name: Deploy to github pages
      id: deployment
      uses: actions/deploy-pages@v4

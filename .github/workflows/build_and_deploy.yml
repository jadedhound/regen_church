name: Build and Deploy

on: 
  push:
   branches:
    - stable

jobs:
  build:
    # No caching is used because the CMS is run on the same machine as
    # the self-hosted runner.
    name: Build Website
    runs-on: self-hosted

    steps:
    - name: Checkout main
      uses: actions/checkout@v4

    - name: Download zola
      uses: taiki-e/install-action@v2
      with:
        tool: zola@0.20.0

    - name: Setup bun
      uses: oven-sh/setup-bun@v2

    - name: Build with bun and zola
      env:
        GPG_PASSPHRASE: ${{ secrets.REGEN_PASSPHRASE }}
      run: |
        bun install
        bun pocketbase.mjs $GPG_PASSPHRASE
        bun run prod

    - name: Deploy
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy ./dist --project-name=regen-website
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

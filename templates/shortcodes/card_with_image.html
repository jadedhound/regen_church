<div class="bg-slate-100">
    {% set meta = get_image_metadata(path=image) %}
    {% set small = resize_image(path=image, width=1280, height=720, op="fill", format="webp", quality=70) %}
    {% set big = resize_image(path=image, width=1920, height=1080, op="fill", format="webp", quality=70) %}

    <picture>
      <source media="(max-width: 767px)" srcset="{{ small.url }}">
      <img 
        class="p-8"
        src="{{ big.url }}" 
        alt="cover image"
      >
    </picture>
    <div class="text-black px-4">
        <div class="text-4xl font-bold relative">
          <div class="absolute top-0 left-0"> {{ title }} </div>
          <div class="psuedo py-2"></div>
          <div class="psuedo bg-blue-500 py-2"></div>
        </div>
        <div class="[&>ul]:list-disc pl-5 text-2xl [&>ul>li]:py-2">
          {{ body | markdown | safe }}
        </div>
    </div>
</div>

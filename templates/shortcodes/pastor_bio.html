{% import "macros/image.html" as img_macro %}

<div class="grid md:grid-cols-3 gap-4">
  <div class="md:col-span-3 text-center">
    <h1 class="text-2xl uppercase font-bold text-secondary">{{ name }}</h1>
    <h4 class="text-onBackground/80">{{ role }}</h4>
  </div>
  <div class="flex flex-col gap-4 rounded-md pb-4">
    <div class="aspect-square overflow-hidden rounded-t-md mb-2">
      {{ img_macro::simple(
          image=image,
          sizes="100vw",
          alt="{{ name ~ ' portrait' }}",
          class="h-full w-full object-cover rounded-md",
      ) }}
    </div>
    <a href="tel:{{ number | replace(from=' ', to='') }}">
      <div class="regen-button justify-start">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-blue-600">
          <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
        </svg>
        <div>{{ number }}</div>
      </div>
    </a>
    <a href="mailto:{{ email }}">
      <div class="regen-button justify-start">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-green-600">
          <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
          <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
        </svg>
        <!-- Padding apply directly to email to make overflows look better. -->
        <div class="w-1 grow"><span class="pr-4">{{ email }}</span></div>
      </div>
    </a>
    <div class="flex gap-4 pt-2 px-4">

        <path fill="#382E2D" d="M314 157c12-10 26-19 40-25l9 14 8 15 5 11-8 2-10 1h-8l-3-1h-3l-3-1-3-1-2-1-3-1-3-1-2-1-3-2-2-1-2-2-3-2-2-2-2-2Z"/>

      </svg>
      <div class="font-semibold">{{ 'Day Off: ' ~ day_off }}</div>
    </div>
  </div>

  <div class="md:col-span-2 px-4">
    {{ body | markdown | safe }}
  </div>

</div>

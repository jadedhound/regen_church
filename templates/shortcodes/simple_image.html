{% set meta = get_image_metadata(path=image) %}
{% set small = resize_image(path=image, height=720, op="fit_height", format="webp", quality=70) %}
{% set big = resize_image(path=image, height=1080, op="fit_height", format="webp", quality=70) %}

<div class="{{ container_class | default(value='')}}">
  <picture>
    <source media="(max-width: 767px)" srcset="{{ small.url }}">
    <img 
      class="{{ image_class | default(value='')}}"
      src="{{ big.url }}" 
      alt="cover image"
    >
  </picture>
</div>

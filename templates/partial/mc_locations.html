{% set data = load_data(path="build/mc_locations.yml", format="yaml") %}

<div class="grid sm:grid-cols-3 gap-4 divide-y-1 md:divide-y-0 max-w-3xl md:mx-auto">
  {% for mc in data %}
    <div class="flex flex-col gap-4 pb-2">
      <h3>{{ mc.name }}</h3>
      <div class="flex gap-2 capitalize">
        <svg class="text-yellow-400"><use href="{{ sprites }}#clock"></use></svg>
        {{ mc.day }}
      </div>
      <div class="flex gap-2 capitalize">
        <svg class="text-blue-500"><use href="{{ sprites }}#map-pin"></use></svg>
        {{ mc.location }}
      </div>
      <ul class="capitalize">
        {% for leader in mc.leaders %}
          <li> {{ leader }} </li>
        {% endfor %}
      </ul>
    </div>
  {% endfor %}
</div>

{% set link_css = 'flex items-center gap-2' %}

<div class="grid gap-4 mx-auto w-fit">
  <a href="https://www.facebook.com/regenerationchurchmonash" target="_blank" class="{{ link_css }}">
    <svg class="text-blue-600"><use href="{{ sprites }}#facebook"></use></svg>
    Facebook
  </a>
  <a href="https://regenerationchurchmonash.elvanto.com.au/login" target="_blank" class="{{ link_css }}">
    <svg class="size-5 text-green-600"><use href="{{ sprites }}#elvanto"></use></svg>
    <span class="ml-1">Elvanto</span>
  </a>
  <a href="https://github.com/jadedhound/regen_church" target="_blank" class="{{ link_css }} whitespace-nowrap">
    <svg><use href="{{ sprites }}#github"></use></svg>
    v{{- now() | date(format="%d.%m.%y") -}}
  </a>
</div>
